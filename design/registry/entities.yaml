# Entity Registry — Garrison
# Cross-system facts. Values here are locked — conflicts must be surfaced
# before a GDD can change them. Used by /consistency-check and GDD authoring.
# Last updated: 2026-05-18

entities:

  - name: enemy
    type: entity
    source: enemy-wave
    referenced_by: [castle, archer-formation, hero-movement, economy, hud, archer-tower]
    attributes:
      ENEMY_RADIUS: { value: 12, unit: px }
      ENEMY_HP_BASE: { value: 30, unit: HP }
      ENEMY_HP_SCALING: { value: 3, unit: "HP/wave" }
      ENEMY_SPEED: { value: 70, unit: "px/s" }

formulas:

  - name: enemies_per_wave
    type: formula
    source: enemy-wave
    referenced_by: [hud, economy, archer-formation]
    expression: "min(ENEMIES_PER_WAVE_MAX, ENEMIES_PER_WAVE_BASE + (n - 1) * ENEMIES_PER_WAVE_SCALING)"
    variables:
      - { name: n, type: int, range: "1-inf" }
      - { name: ENEMIES_PER_WAVE_BASE, value: 5, type: int, range: "3-10" }
      - { name: ENEMIES_PER_WAVE_SCALING, value: 2, type: int, range: "1-4" }
      - { name: ENEMIES_PER_WAVE_MAX, value: 20, type: int, range: "10-30" }
    output: { min: 5, max: 20, unit: enemies }

  - name: enemy_hp
    type: formula
    source: enemy-wave
    referenced_by: [archer-formation, hero-movement]
    expression: "ENEMY_HP_BASE + (n - 1) * ENEMY_HP_SCALING"
    variables:
      - { name: n, type: int, range: "1-inf" }
      - { name: ENEMY_HP_BASE, value: 30, type: int, range: "10-60" }
      - { name: ENEMY_HP_SCALING, value: 3, type: int, range: "1-10" }
    output: { min: 30, max: null, unit: HP, note: "unbounded — HP scaling is late-game lever" }

  - name: gold_max
    type: formula
    source: economy
    referenced_by: []
    expression: "enemies_per_wave(n) * GOLD_DROP_PER_ENEMY"
    variables:
      - { name: n, type: int, range: "1-inf" }
      - { name: GOLD_DROP_PER_ENEMY, value: 15, type: int, range: "5-30", unit: g }
    output: { min: 75, max: 300, unit: g, note: "theoretical max if all enemies killed and collected" }

  - name: recruit_cost
    type: formula
    source: economy
    referenced_by: [archer-formation]
    expression: "ARCHER_COST_TIER_1 if current_archer_count < 4 else ARCHER_COST_TIER_2"
    variables:
      - { name: current_archer_count, type: int, range: "0-7" }
      - { name: ARCHER_COST_TIER_1, value: 30, type: int, unit: g }
      - { name: ARCHER_COST_TIER_2, value: 60, type: int, unit: g }
    output: { values: [30, 60], unit: g }

  - name: volley_damage
    type: formula
    source: archer-formation
    referenced_by: [archer-tower, hud]
    expression: "n * PROJ_DAMAGE"
    variables:
      - { name: n, type: int, range: "1-8", description: "occupied formation slots" }
      - { name: PROJ_DAMAGE, value: 8, type: int, unit: HP }
    output: { min: 8, max: 64, unit: HP, note: "linear; each slot adds PROJ_DAMAGE per volley" }

  - name: formation_dps
    type: formula
    source: archer-formation
    referenced_by: [archer-tower]
    expression: "(n * PROJ_DAMAGE) / SHOOT_IVTL"
    variables:
      - { name: n, type: int, range: "1-8" }
      - { name: PROJ_DAMAGE, value: 8, type: int, unit: HP }
      - { name: SHOOT_IVTL, value: 0.9, type: float, unit: s }
    output: { min: 8.89, max: 71.11, unit: "HP/s", note: "linear; each archer adds 8/0.9 ≈ 8.89 DPS" }

  - name: spawn_duration
    type: formula
    source: enemy-wave
    referenced_by: []
    expression: "(enemies_per_wave(n) - 1) * SPAWN_INTERVAL"
    variables:
      - { name: enemies_per_wave_n, type: int, range: "5-20" }
      - { name: SPAWN_INTERVAL, value: 2.0, type: float, range: "0.5-4.0", unit: s }
    output: { min: 8, max: 38, unit: s, note: "capped when enemies_per_wave hits ENEMIES_PER_WAVE_MAX" }

  - name: tower_volley_damage
    type: formula
    source: archer-tower
    referenced_by: []
    expression: "TOWER_ARCHERS_COUNT * PROJ_DAMAGE"
    variables:
      - { name: TOWER_ARCHERS_COUNT, value: 2, type: int }
      - { name: PROJ_DAMAGE, value: 8, type: int, unit: HP }
    output: { min: 16, max: 16, unit: HP, note: "fixed constant — does not vary by wave or enemy" }

  - name: tower_dps
    type: formula
    source: archer-tower
    referenced_by: []
    expression: "(TOWER_ARCHERS_COUNT * PROJ_DAMAGE) / SHOOT_IVTL"
    variables:
      - { name: TOWER_ARCHERS_COUNT, value: 2, type: int }
      - { name: PROJ_DAMAGE, value: 8, type: int, unit: HP }
      - { name: SHOOT_IVTL, value: 0.9, type: float, unit: s }
    output: { min: 17.78, max: 17.78, unit: "HP/s", note: "fixed constant — same as formation_dps(TOWER_ARCHERS_COUNT). Redistributes DPS spatially; does not increase system_dps total." }

  - name: engagement_time
    type: formula
    source: archer-tower
    referenced_by: []
    expression: "(2 * TOWER_RANGE) / ENEMY_SPEED"
    variables:
      - { name: TOWER_RANGE, value: 400, type: int, unit: px }
      - { name: ENEMY_SPEED, value: 70, type: float, unit: "px/s" }
    output: { min: 11.43, max: 11.43, unit: s, note: "fixed at 11.43s with current constants → 12 volleys per enemy pass → tower can solo-kill until ~wave 55" }

constants:

  - name: SPAWN_Y_BASE
    type: constant
    source: enemy-wave
    value: 1860
    unit: px
    referenced_by: []

  - name: SPAWN_ROW_CAPACITY
    type: constant
    source: enemy-wave
    value: 13
    unit: enemies
    note: "derived: floor(1080 / SPAWN_X_MIN_SEP) = floor(1080 / 80) = 13"
    referenced_by: []

  - name: SPAWN_ROW_OFFSET
    type: constant
    source: enemy-wave
    value: 30
    unit: px
    referenced_by: []

  - name: SPAWN_X_MIN_SEP
    type: constant
    source: enemy-wave
    value: 80
    unit: px
    referenced_by: []

  - name: INTER_WAVE_PAUSE
    type: constant
    source: enemy-wave
    value: 10.0
    unit: s
    referenced_by: [hud, economy]

  - name: ENEMIES_PER_WAVE_MAX
    type: constant
    source: enemy-wave
    value: 20
    unit: enemies
    referenced_by: []

  - name: SPAWN_INTERVAL
    type: constant
    source: enemy-wave
    value: 2.0
    unit: s
    referenced_by: []

  - name: STARTING_GOLD
    type: constant
    source: economy
    value: 60
    unit: g
    referenced_by: [game-state]
    note: "coupled with STARTING_ARCHERS=2 (see archer-formation). Validated in prototype 2."

  - name: GOLD_DROP_PER_ENEMY
    type: constant
    source: economy
    value: 15
    unit: g
    referenced_by: []
    note: "coupled with ARCHER_COST_TIER_1 — kill-to-archer ratio = ARCHER_COST_TIER_1 / GOLD_DROP_PER_ENEMY = 2.0. Change the pair together."

  - name: GOLD_MAGNET_RADIUS
    type: constant
    source: economy
    value: 170
    unit: px
    referenced_by: [forge]
    note: "validated in prototype 1 (garrison-concept)"

  - name: DWELL_TIME
    type: constant
    source: economy
    value: 0.8
    unit: s
    referenced_by: []
    note: "validated in prototype 2 (economy-spatial-concept)"

  - name: ZONE_RADIUS
    type: constant
    source: economy
    value: 90
    unit: px
    referenced_by: []
    note: "touch-safe radius; 60px was original placeholder, raised to 90px for joystick precision tolerance"

  - name: ARCHER_COST_TIER_1
    type: constant
    source: economy
    value: 30
    unit: g
    referenced_by: [archer-formation, hud]
    note: "cost for archers 1-4. Coupled with GOLD_DROP_PER_ENEMY."

  - name: ARCHER_COST_TIER_2
    type: constant
    source: economy
    value: 60
    unit: g
    referenced_by: [archer-formation, hud]
    note: "cost for archers 5-8."

  - name: TOWER_COST
    type: constant
    source: economy
    value: 100
    unit: g
    referenced_by: [archer-tower]
    note: "MVP milestone — TOWER_ZONE active in MVP (promoted from Vertical Slice on 2026-05-19, see review-all-gdds D-01: gold sink gap resolution)."

  - name: FORGE_COST
    type: constant
    source: economy
    value: 200
    unit: g
    referenced_by: [forge]
    note: "Alpha milestone — FORGE_ZONE inactive in MVP."

  - name: COIN_POOL_MAX
    type: constant
    source: economy
    value: 120
    unit: coins
    referenced_by: []
    note: "safety cap on active GoldCoin nodes; oldest freed if exceeded"

  - name: STARTING_ARCHERS
    type: constant
    source: archer-formation
    value: 2
    unit: archers
    referenced_by: [economy, game-state, hud]
    note: "coupled with STARTING_GOLD=60g (see economy). Validated in prototype 2."

  - name: PROJ_DAMAGE
    type: constant
    source: archer-formation
    value: 8
    unit: HP
    referenced_by: [archer-tower, forge]
    note: "damage per projectile hit. Coupled with SHOOT_IVTL — change together for formation_dps balance."

  - name: PROJ_SPEED
    type: constant
    source: archer-formation
    value: 600
    unit: "px/s"
    referenced_by: []
    note: "projectile travel speed. Feel constant — no balance consequence. Min: 300 (floaty), max: 900 (invisible at 60fps)."

  - name: ARCHER_FOLLOW_LERP
    type: constant
    source: archer-formation
    value: 0.12
    unit: null
    referenced_by: []
    note: "validated in prototype 1. Safe range: 0.05-0.25."

  - name: ARCHER_ROW_DEPTH
    type: constant
    source: archer-formation
    value: 30
    unit: px
    referenced_by: []
    note: "depth step per slot pair in V-formation. Provisional — verify in first playable build."

  - name: ARCHER_INNER_SEP
    type: constant
    source: archer-formation
    value: 25
    unit: px
    referenced_by: []
    note: "lateral offset for pair 0 (slots 0,1). Must be < ARCHER_MID_SEP."

  - name: ARCHER_MID_SEP
    type: constant
    source: archer-formation
    value: 50
    unit: px
    referenced_by: []
    note: "lateral offset for pair 1 (slots 2,3). Must be > ARCHER_INNER_SEP and < ARCHER_OUTER_SEP."

  - name: ARCHER_OUTER_SEP
    type: constant
    source: archer-formation
    value: 75
    unit: px
    referenced_by: []
    note: "lateral offset for pair 2 (slots 4,5). Must be > ARCHER_MID_SEP and < ARCHER_OUTERMOST_SEP."

  - name: ARCHER_OUTERMOST_SEP
    type: constant
    source: archer-formation
    value: 100
    unit: px
    referenced_by: []
    note: "lateral offset for pair 3 (slots 6,7). Formation width = 2×100 = 200px. Max: 120px before edge clipping."

  - name: ARCHER_SNAP_THRESHOLD
    type: constant
    source: archer-formation
    value: 300
    unit: px
    referenced_by: []
    note: "if archer lag exceeds this, snap directly to slot_world_pos instead of lerping."

  - name: TOWER_ARCHERS_COUNT
    type: constant
    source: archer-tower
    value: 2
    unit: archers
    referenced_by: []
    note: "number of archers permanently absorbed from the mobile formation per tower purchase. Tuning knob — safe range 1–4."

  - name: TOWER_RANGE
    type: constant
    source: archer-tower
    value: 400
    unit: px
    referenced_by: []
    note: "radius of the ArcherTower's enemy detection Area2D. Tuning knob — safe range 150–600px. Coverage fraction = (2×TOWER_RANGE)/1860."

  - name: FORGE_PROJ_DAMAGE_DELTA
    type: constant
    source: forge
    value: 2
    unit: HP
    referenced_by: []
    note: "flat HP added to PROJ_DAMAGE per PROJ_DAMAGE_UP Forge purchase. Tuning knob — safe range 1–4 HP. Couples with PROJ_DAMAGE."

  - name: FORGE_IVTL_DELTA
    type: constant
    source: forge
    value: 0.10
    unit: s
    referenced_by: []
    note: "fire interval reduction per SHOOT_IVTL_DOWN Forge purchase. Saturates at SHOOT_IVTL_FLOOR. Tuning knob — safe range 0.05–0.15s."

  - name: SHOOT_IVTL_FLOOR
    type: constant
    source: forge
    value: 0.40
    unit: s
    referenced_by: []
    note: "minimum fire interval after SHOOT_IVTL_DOWN upgrades. Required correctness constraint — must be > 0.0s to prevent divide-by-zero. Also buffs Archer Tower DPS (shared constant). Safe range 0.30–0.60s."

  - name: FORGE_MAGNET_DELTA
    type: constant
    source: forge
    value: 40
    unit: px
    referenced_by: []
    note: "radius increase per GOLD_MAGNET_RADIUS_UP Forge purchase. Capped at GOLD_MAGNET_CEILING. Tuning knob — safe range 20–60px."

  - name: GOLD_MAGNET_CEILING
    type: constant
    source: forge
    value: 450
    unit: px
    referenced_by: []
    note: "maximum GOLD_MAGNET_RADIUS after Forge upgrades. Prevents full-world gold vacuum (world half-width = 540px). Ceiling reached at k=7 purchases. Safe range 350–520px."

  - name: FORGE_HP_DELTA
    type: constant
    source: forge
    value: 30
    unit: HP
    referenced_by: []
    note: "HP added to CASTLE_MAX_HP per CASTLE_MAX_HP_UP Forge purchase. Does not heal current HP. Tuning knob — safe range 20–60 HP. Consider raising to 40 HP if playtesting shows CASTLE_MAX_HP_UP is consistently skipped."
